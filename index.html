<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Pages Site</title>
    
    <!-- Forces Cast Sender API to inject directly into the DOM -->
    <script type="text/javascript" src="https://gstatic.com"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 30px;
            background-color: #ffffff;
            color: #000000;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        p {
            font-size: 16px;
            color: #555;
            margin-bottom: 25px;
        }

        /* Bulletproof style wrapper to ensure the icon renders visually */
        .cast-btn-wrapper {
            display: inline-block;
            background-color: #e0e0e0; /* Gray anchor block visible even if script delays */
            border: 2px solid #333333;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .cast-btn-wrapper:hover {
            background-color: #d4d4d4;
        }

        /* Forces Google's hidden UI tag to have physical width and height */
        google-cast-launcher {
            display: block !important;
            width: 50px !important;
            height: 50px !important;
            cursor: pointer;
            --connected-color: #4285f4;
            --disconnected-color: #000000;
        }
    </style>
</head>
<body>

    <h1>Hello World! Welcome to my website.</h1>
    <p>Click the block below to discover and connect to your Nest Hub:</p>
    
    <!-- Visual container enclosing the launcher tag -->
    <div class="cast-btn-wrapper">
        <google-cast-launcher id="cast-button"></google-cast-launcher>
    </div>

    <script>
        // High-level CAF API initialization sequence
        window.__onGCastApiAvailable = function(isAvailable) {
            if (isAvailable) {
                initializeCastApi();
            } else {
                console.log("Cast API not available yet.");
            }
        };

        function initializeCastApi() {
            const context = cast.framework.CastContext.getInstance();
            context.setOptions({
                receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
                autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
            });
            console.log("Cast API successfully initialized.");
        }
    </script>

</body>
</html>
